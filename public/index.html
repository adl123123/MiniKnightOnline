<script>
const socket=io({transports:['websocket']});const cv=document.getElementById('c'),ctx=cv.getContext('2d');const W=360,H=640;let dpr=devicePixelRatio||1,sc=1,ox=0,oy=0,state=null,myId=null,playing=false,shopOpen=false,keys={},mouse={x:180,y:300,down:false},joy=null,fireTouch=null,lastInput='',lastInputAt=0,snapshotAt=performance.now(),localPred=null,lastFrame=performance.now(),lastRoomKey=null,playerHistory=new Map(),enemyHistory=new Map(),clockOffset=null,netJitter=0,arrivalJitter=0,interpDelay=220,lastArrivalWall=0,lastServerTime=0,localRollUntil=0,localRollDir={x:0,y:0},debugHud=true,netDiag={rtt:0,jitter:0,lastRtt:0,minRtt:1e9,fps:60,frames:0,fpsAt:performance.now(),snapshots:0,snapHz:0,snapAt:performance.now(),dropped:0,lastSeq:null,lastPacketAt:performance.now(),quality:'—'};
const WP={pistol:{n:'Пистолет',c:'#ffd84a'},shotgun:{n:'Дробовик',c:'#ff8a4a'},smg:{n:'ПП',c:'#6ee7ff'},rifle:{n:'Винтовка',c:'#c58bff'}};
const SHOP=[['Сердце +2 HP',5,'#ff6b81'],['Пистолет',6,'#ffd84a'],['Дробовик',10,'#ff8a4a'],['ПП',12,'#6ee7ff'],['Винтовка',15,'#c58bff']];
function resize(){const w=innerWidth,h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;sc=Math.min(w/W,h/H);ox=(w-W*sc)/2;oy=(h-H*sc)/2}addEventListener('resize',resize);resize();
const lp=e=>[(e.clientX-ox)/sc,(e.clientY-oy)/sc];
function me(){return state&&state.players.find(p=>p.id===myId)}
function pushHistory(map,obj,serverTime){
 let h=map.get(obj.id);if(!h){h=[];map.set(obj.id,h)}
 // Серверное время, а не время прихода пакета: сетевой jitter больше не превращается в рывки.
 if(h.length&&serverTime<=h[h.length-1].t)return;
 h.push({t:serverTime,x:obj.x,y:obj.y,face:obj.face||0,dead:!!obj.dead,roll:obj.roll||0});
 const cutoff=serverTime-5000;while(h.length>2&&h[0].t<cutoff)h.shift();
}
function serverNow(){return Date.now()-(clockOffset||0)}
function interpHistory(obj,map,delay=interpDelay,maxExtrapMs=35){
 const h=map.get(obj.id);if(!h||!h.length)return obj;
 const target=serverNow()-delay;
 if(h.length===1)return {...obj,x:h[0].x,y:h[0].y,face:h[0].face};
 if(target<=h[0].t){const q=h[0];return {...obj,x:q.x,y:q.y,face:q.face}}
 const last=h[h.length-1],prev=h[h.length-2];
 // При плохой сети почти не экстраполируем: лучше небольшая задержка, чем рывок вперёд-назад.
 if(target>=last.t){
   const extra=Math.min(maxExtrapMs,target-last.t),span=Math.max(1,last.t-prev.t);
   let vx=(last.x-prev.x)/span,vy=(last.y-prev.y)/span;
   const speed=Math.hypot(vx,vy)*1000,maxSpeed=360;
   if(speed>maxSpeed){const k=maxSpeed/speed;vx*=k;vy*=k}
   return {...obj,x:last.x+vx*extra,y:last.y+vy*extra,face:last.face};
 }
 let lo=0,hi=h.length-1;
 while(hi-lo>1){const m=(lo+hi)>>1;if(h[m].t<=target)lo=m;else hi=m}
 const a=h[lo],b=h[hi],span=Math.max(1,b.t-a.t),u=Math.max(0,Math.min(1,(target-a.t)/span));
 // smoothstep уменьшает визуальный удар при неравномерных сетевых интервалах.
 const su=u*u*(3-2*u);
 let df=((b.face-a.face+Math.PI*3)%(Math.PI*2))-Math.PI;
 return {...obj,x:a.x+(b.x-a.x)*su,y:a.y+(b.y-a.y)*su,face:a.face+df*su};
}

function currentMoveInput(){
 let x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
 let y=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
 if(joy){x=joy.dx;y=joy.dy}
 let l=Math.hypot(x,y);if(l>1){x/=l;y/=l}
 return{x,y};
}
function clientHitObs(x,y,rad){const r=state&&state.room;if(!r)return false;return r.obs.some(q=>x+rad>q.x&&x-rad<q.x+q.w&&y+rad>q.y&&y-rad<q.y+q.h)}
function clientMove(o,dx,dy,rad){if(!clientHitObs(o.x+dx,o.y,rad))o.x+=dx;if(!clientHitObs(o.x,o.y+dy,rad))o.y+=dy;o.x=Math.max(28,Math.min(332,o.x));o.y=Math.max(88,Math.min(512,o.y))}
function predictedMe(p,dt){
 const roomKey=state?.current;
 if(!localPred||lastRoomKey!==roomKey){localPred={x:p.x,y:p.y};lastRoomKey=roomKey}
 if(p.dead){localPred.x=p.x;localPred.y=p.y;localRollUntil=0;return {...p,x:localPred.x,y:localPred.y}}
 const inp=currentMoveInput(),now=performance.now();
 const locallyRolling=now<localRollUntil;
 let moving=Math.hypot(inp.x,inp.y)>.08||locallyRolling;
 let speed=locallyRolling?330:140,dx=locallyRolling?localRollDir.x:inp.x,dy=locallyRolling?localRollDir.y:inp.y;
 clientMove(localPred,dx*speed*dt,dy*speed*dt,8);
 const ex=p.x-localPred.x,ey=p.y-localPred.y,err=Math.hypot(ex,ey);
 // Локальное управление имеет приоритет. Авторитет сервера корректирует только накопившуюся ошибку.
 if(err>135){localPred.x=p.x;localPred.y=p.y}
 else if(!moving){const a=1-Math.exp(-9*dt);localPred.x+=ex*a;localPred.y+=ey*a}
 else if(err>70){const a=1-Math.exp(-1.2*dt);localPred.x+=ex*a;localPred.y+=ey*a}
 return {...p,x:localPred.x,y:localPred.y,roll:locallyRolling?.1:p.roll};
}
function triggerRoll(){
 const p=me();if(!p||p.dead||performance.now()<localRollUntil)return;
 let inp=currentMoveInput(),l=Math.hypot(inp.x,inp.y),dx,dy;
 if(l<.15){dx=Math.cos(p.face);dy=Math.sin(p.face)}else{dx=inp.x/l;dy=inp.y/l}
 localRollDir={x:dx,y:dy};localRollUntil=performance.now()+280;socket.emit('roll');
}

function cleanupHistories(){
 if(!state)return;
 const pids=new Set(state.players.map(p=>p.id)),eids=new Set(state.enemies.map(e=>e.id));
 for(const k of playerHistory.keys())if(!pids.has(k))playerHistory.delete(k);
 for(const k of enemyHistory.keys())if(!eids.has(k))enemyHistory.delete(k);
}

function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function txt(s,x,y,z,c,a='center'){ctx.font='bold '+z+'px monospace';ctx.textAlign=a;ctx.fillStyle=c;ctx.fillText(s,x,y)}
function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function drawKnight(p,isMe){circle(p.x,p.y+9,9,'#0005');if(p.dead){ctx.globalAlpha=.38}rect(p.x-8,p.y-8,16,18,isMe?'#4a7cff':'#ff7a91');rect(p.x-6,p.y-14,12,7,'#c3cbe0');rect(p.x-3,p.y-18,6,4,isMe?'#ffd84a':'#9fffdc');ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.face);rect(5,-2,13,4,WP[p.w]?.c||'#fff');ctx.restore();ctx.globalAlpha=1;txt(p.dead?'☠ '+p.name:p.name,p.x,p.y-24,8,p.dead?'#ff7a91':(isMe?'#ffd84a':'#fff'));if(p.dead)txt('респавн '+Math.ceil(p.respawn||0),p.x,p.y-34,8,'#fff');}
function drawEnemy(e){const c=e.type==='king'?'#b060ff':e.type==='blue'?'#4aa8ff':'#5fd068';circle(e.x,e.y,e.r,c);circle(e.x-4,e.y-2,2,'#fff');circle(e.x+4,e.y-2,2,'#fff');const bw=e.type==='king'?90:34;rect(e.x-bw/2,e.y-e.r-15,bw,4,'#271622');rect(e.x-bw/2,e.y-e.r-15,bw*Math.max(0,e.hp)/e.maxHp,4,e.type==='king'?'#ff5470':'#9af0a0');txt(Math.ceil(e.hp)+'/'+e.maxHp,e.x,e.y-e.r-19,e.type==='king'?10:8,'#fff')}
function drawRoom(){const r=state.room;rect(0,0,W,H,'#0e0d16');rect(20,80,320,440,'#3a3652');for(let i=0;i<16;i++)for(let j=0;j<22;j++)rect(20+i*20,80+j*20,20,20,(i+j)%2?'#3b3855':'#403c5b');rect(0,60,360,20,'#25213a');rect(0,520,360,20,'#25213a');rect(0,60,20,480,'#25213a');rect(340,60,20,480,'#25213a');
 for(const d in r.doors){const open=r.done;if(d==='u')rect(160,60,40,20,open?'#11101d':'#77718d');if(d==='d')rect(160,520,40,20,open?'#11101d':'#77718d');if(d==='l')rect(0,280,20,40,open?'#11101d':'#77718d');if(d==='r')rect(340,280,20,40,open?'#11101d':'#77718d')}
 for(const q of r.obs){rect(q.x,q.y,q.w,q.h,'#6f6990');rect(q.x,q.y,q.w,3,'#9a94bf')}
 if(r.type==='shop'){rect(112,247,136,80,'#6b3f24');rect(105,240,150,18,'#a96532');circle(180,232,13,'#e6b98a');rect(166,245,28,22,'#4aa8ff');txt('ТОРГОВЕЦ',180,350,13,'#9fffdc');txt('E / ВЗЯТЬ — магазин',180,368,11,'#fff')}
 for(const it of r.items){if(it.kind==='weapon'){rect(it.x-11,it.y-8,22,15,'#8a5a2a');rect(it.x-3,it.y-5,6,6,WP[it.weapon].c);txt(WP[it.weapon].n,it.x,it.y-14,9,WP[it.weapon].c)}else if(it.kind==='coin'){circle(it.x,it.y,6,'#ffd84a')}}
 if(state.portal){for(let i=1;i<=4;i++){ctx.strokeStyle=i%2?'#7df':'#c6f';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(180,300,i*6,i*9,performance.now()/900*(i%2?1:-1),0,Math.PI*2);ctx.stroke()}}
}
function drawDebug(){
 if(!debugHud)return;
 const now=performance.now(),age=Math.max(0,now-netDiag.lastPacketAt),sp=state?.serverPerf||{};
 const q=netDiag.rtt<120&&netDiag.jitter<35?'GOOD':netDiag.rtt<220&&netDiag.jitter<90?'OK':'UNSTABLE';
 netDiag.quality=q;
 const qc=q==='GOOD'?'#8f8':q==='OK'?'#fd8':'#f88';
 const x=8,y=66,w=176,h=164;
 ctx.save();ctx.globalAlpha=.9;ctx.fillStyle='#0b0b12';ctx.fillRect(x,y,w,h);ctx.globalAlpha=1;
 ctx.strokeStyle='#4f4a6d';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);
 ctx.font='bold 10px monospace';ctx.textAlign='left';ctx.fillStyle='#7df';ctx.fillText('NET DEBUG v9',x+7,y+14);
 ctx.fillStyle=qc;ctx.fillText('QUALITY: '+q,x+88,y+14);
 ctx.font='10px monospace';
 const rows=[
  ['RTT',Math.round(netDiag.rtt)+' ms',netDiag.rtt<120?'#8f8':netDiag.rtt<220?'#fd8':'#f88'],
  ['Jitter',Math.round(netDiag.jitter)+' ms',netDiag.jitter<35?'#8f8':netDiag.jitter<90?'#fd8':'#f88'],
  ['Client FPS',Math.round(netDiag.fps),netDiag.fps>=50?'#8f8':netDiag.fps>=30?'#fd8':'#f88'],
  ['Snapshots',netDiag.snapHz.toFixed(1)+'/s',netDiag.snapHz>=17?'#8f8':netDiag.snapHz>=12?'#fd8':'#f88'],
  ['Dropped',String(netDiag.dropped),netDiag.dropped===0?'#8f8':'#fd8'],
  ['Packet age',Math.round(age)+' ms',age<120?'#8f8':age<250?'#fd8':'#f88'],
  ['Interp',Math.round(interpDelay)+' ms',interpDelay<260?'#8f8':interpDelay<400?'#fd8':'#f88'],
  ['Clock off',clockOffset==null?'—':Math.round(clockOffset)+' ms','#bbb'],
  ['Server tick',(sp.tickHz??0)+'/s',(sp.tickHz??0)>=27?'#8f8':'#f88'],
  ['Server snap',(sp.snapshotHz??0)+'/s',(sp.snapshotHz??0)>=17?'#8f8':'#f88']
 ];
 rows.forEach((r,i)=>{const yy=y+30+i*12;ctx.fillStyle='#bbb';ctx.fillText(r[0]+':',x+7,yy);ctx.fillStyle=r[2];ctx.fillText(r[1],x+92,yy)});
 ctx.restore();
}
function render(){const now=performance.now(),dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;netDiag.frames++;if(now-netDiag.fpsAt>=500){netDiag.fps=netDiag.frames*1000/(now-netDiag.fpsAt);netDiag.frames=0;netDiag.fpsAt=now;}ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0e0d16';ctx.fillRect(0,0,cv.width,cv.height);ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*ox,dpr*oy);ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();if(!state){txt('Подключение…',180,320,18,'#fff');return requestAnimationFrame(render)}drawRoom();const netAge=Math.max(0,Math.min(.08,state?.serverTime?(serverNow()-state.serverTime)/1000:(performance.now()-snapshotAt)/1000));for(const b of state.bullets)rect(b.x+(b.vx||0)*netAge-2,b.y+(b.vy||0)*netAge-2,4,4,'#ffe98a');for(const b of state.enemyBullets)circle(b.x+(b.vx||0)*netAge,b.y+(b.vy||0)*netAge,3.5,'#ff4d6d');for(const e of state.enemies)drawEnemy(interpHistory(e,enemyHistory,interpDelay,25));for(const p of state.players){const rp=p.id===myId?predictedMe(p,dt):interpHistory(p,playerHistory,interpDelay,30);drawKnight(rp,p.id===myId)};
 const p=me();rect(0,0,W,60,'#0e0d16');if(p){for(let i=0;i<6;i++)circle(14+i*18,17,6,i<p.hp?'#ff4d6d':'#3a2a3a');txt('🪙 '+p.coins,122,20,12,'#ffd84a','left');txt(WP[p.w]?.n||'',10,47,12,WP[p.w]?.c||'#fff','left');for(let i=0;i<3;i++){const x=116+i*55,w=p.weps[i];rect(x,34,48,20,i===p.slot?'#5b5580':'#28243c');txt((i+1)+' '+(w?WP[w].n.slice(0,5):'—'),x+24,48,9,w?WP[w].c:'#777')}}txt('ЛОББИ '+state.code,350,18,8,'#9fffdc','right');
 // touch controls
 ctx.globalAlpha=.28;circle(70,590,36,'#fff');circle(300,590,36,'#ff5a64');circle(235,535,27,'#d7a93b');circle(300,520,25,'#6f69a0');ctx.globalAlpha=1;txt('ОГОНЬ',300,594,8,'#fff');txt('ВЗЯТЬ',235,539,8,'#fff');txt('КУВ',300,524,8,'#fff');
 if(p&&p.dead){ctx.fillStyle='rgba(0,0,0,.38)';ctx.fillRect(0,60,W,480);txt('ТЫ ПАЛ',180,270,30,'#ff5470');txt('Возрождение через '+Math.max(1,Math.ceil(p.respawn||0)),180,305,14,'#fff')}if(shopOpen&&!p?.dead)drawShop(p);drawDebug();requestAnimationFrame(render)}requestAnimationFrame(render);
function drawShop(p){ctx.fillStyle='rgba(7,6,14,.92)';ctx.fillRect(28,92,304,430);rect(40,106,280,42,'#28243c');txt('МАГАЗИН',180,132,22,'#ffd84a');txt('Монеты: '+p.coins,180,160,13,'#ffd84a');for(let i=0;i<SHOP.length;i++){const [n,price,c]=SHOP[i],y=182+i*55;rect(48,y,264,44,'#211e33');rect(48,y,4,44,c);txt((i+1)+'. '+n,62,y+20,12,c,'left');txt(price+' мон.',300,y+27,11,'#ffd84a','right')}txt('1–5 / тап — купить',180,482,11,'#fff');txt('E / ESC — закрыть',180,505,11,'#cfd3ff')}
function sendInput(){if(!playing||!state)return;const p=me();let x=0,y=0,fire=false;if(p&&!p.dead){const inp=currentMoveInput();x=inp.x;y=inp.y;fire=mouse.down||fireTouch!==null}const payload={x:+x.toFixed(2),y:+y.toFixed(2),aimX:Math.round(mouse.x),aimY:Math.round(mouse.y),fire};const sig=JSON.stringify(payload),now=performance.now();if(sig!==lastInput||now-lastInputAt>500){socket.emit('input',payload);lastInput=sig;lastInputAt=now}}setInterval(sendInput,40);
setInterval(()=>{
 const p0=performance.now(),w0=Date.now();
 socket.emit('netProbe',{wall:w0},res=>{
   const p1=performance.now(),w1=Date.now(),r=p1-p0;
   const diff=netDiag.lastRtt?Math.abs(r-netDiag.lastRtt):0;
   netDiag.jitter=netDiag.lastRtt?netDiag.jitter*.82+diff*.18:0;
   netDiag.rtt=netDiag.rtt?netDiag.rtt*.72+r*.28:r;
   netDiag.minRtt=Math.min(netDiag.minRtt,r);netDiag.lastRtt=r;
   if(res&&Number.isFinite(res.serverTime)){
     // NTP-подобная оценка: серверное время сравниваем с серединой RTT, а не с моментом прихода пакета.
     const off=((w0+w1)/2)-res.serverTime;
     const goodSample=r<=Math.max(netDiag.minRtt*1.8,netDiag.rtt*1.15);
     if(clockOffset==null)clockOffset=off;
     else if(goodSample)clockOffset=clockOffset*.86+off*.14;
   }
   const target=Math.max(150,Math.min(520,145+Math.max(netDiag.jitter*2.4,arrivalJitter*3.2)));
   interpDelay=interpDelay*.88+target*.12;
 })
},700);
function interact(){const p=me();if(!p)return;if(state.room.type==='shop'&&Math.hypot(p.x-180,p.y-300)<85){shopOpen=!shopOpen;return}socket.emit('interact')}
addEventListener('keydown',e=>{if(e.code==='F3'){debugHud=!debugHud;e.preventDefault();return}keys[e.code]=true;if(['Space','KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Digit1','Digit2','Digit3','Digit4','Digit5','KeyE','Escape'].includes(e.code))e.preventDefault();if(!playing)return;if(shopOpen){if(e.code==='KeyE'||e.code==='Escape')shopOpen=false;else if(/^Digit[1-5]$/.test(e.code))socket.emit('buy',+e.code.slice(5)-1);return}if(e.code==='Space')triggerRoll();else if(/^Digit[1-3]$/.test(e.code))socket.emit('slot',+e.code.slice(5)-1);else if(e.code==='KeyE')interact()});addEventListener('keyup',e=>keys[e.code]=false);
cv.addEventListener('mousemove',e=>{[mouse.x,mouse.y]=lp(e)});cv.addEventListener('mousedown',e=>{if(e.button!==0)return;[mouse.x,mouse.y]=lp(e);if(shopOpen){for(let i=0;i<5;i++){const y=182+i*55;if(mouse.x>=48&&mouse.x<=312&&mouse.y>=y&&mouse.y<=y+44){socket.emit('buy',i);return}}}mouse.down=true});addEventListener('mouseup',()=>mouse.down=false);cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const[x,y]=lp(e);if(shopOpen){for(let i=0;i<5;i++){const yy=182+i*55;if(x>=48&&x<=312&&y>=yy&&y<=yy+44){socket.emit('buy',i);return}}shopOpen=false;return}if(Math.hypot(x-235,y-535)<38){interact();return}if(Math.hypot(x-300,y-520)<36){triggerRoll();return}if(Math.hypot(x-300,y-590)<50){fireTouch=e.pointerId;mouse.x=x;mouse.y=y;return}if(x<180&&!joy){joy={id:e.pointerId,sx:x,sy:y,dx:0,dy:0};cv.setPointerCapture(e.pointerId)}});cv.addEventListener('pointermove',e=>{if(joy&&e.pointerId===joy.id){const[x,y]=lp(e);joy.dx=(x-joy.sx)/35;joy.dy=(y-joy.sy)/35;const l=Math.hypot(joy.dx,joy.dy);if(l>1){joy.dx/=l;joy.dy/=l}}});['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>{if(joy&&e.pointerId===joy.id)joy=null;if(fireTouch===e.pointerId)fireTouch=null}));
function enterGame(){playing=true;document.getElementById('lobby').classList.add('hidden');document.getElementById('waiting').classList.add('hidden')}
document.getElementById('create').onclick=()=>{const name=document.getElementById('name').value.trim()||'Рыцарь';socket.emit('createLobby',{name},res=>{if(!res.ok)return showErr(res.error);myId=res.id;document.getElementById('roomCode').textContent=res.code;document.getElementById('lobby').classList.add('hidden');document.getElementById('waiting').classList.remove('hidden')})};
document.getElementById('join').onclick=()=>{const name=document.getElementById('name').value.trim()||'Рыцарь',code=document.getElementById('code').value.trim();socket.emit('joinLobby',{name,code},res=>{if(!res.ok)return showErr(res.error);myId=res.id;enterGame()})};document.getElementById('playNow').onclick=enterGame;function showErr(s){document.getElementById('err').textContent=s||'Ошибка'}
socket.on('state',s=>{
 netDiag.lastPacketAt=performance.now();netDiag.snapshots++;if(netDiag.lastSeq!=null&&Number.isFinite(s.seq)&&s.seq>netDiag.lastSeq+1)netDiag.dropped+=s.seq-netDiag.lastSeq-1;if(Number.isFinite(s.seq))netDiag.lastSeq=s.seq;const sn=performance.now();if(sn-netDiag.snapAt>=1000){netDiag.snapHz=netDiag.snapshots*1000/(sn-netDiag.snapAt);netDiag.snapshots=0;netDiag.snapAt=sn}
 const oldRoom=state?.current,arrivalWall=Date.now(),arrivalPerf=performance.now();
 if(Number.isFinite(s.serverTime)){
   if(lastArrivalWall&&lastServerTime){
     const arrivalDt=arrivalWall-lastArrivalWall,serverDt=s.serverTime-lastServerTime;
     const sampleJitter=Math.abs(arrivalDt-serverDt);
     netJitter=netJitter*.88+sampleJitter*.12;
     arrivalJitter=arrivalJitter*.9+sampleJitter*.1;
     const target=Math.max(150,Math.min(520,145+Math.max(netDiag.jitter*2.4,arrivalJitter*3.2)));
     interpDelay=interpDelay*.92+target*.08;
   }
   lastArrivalWall=arrivalWall;lastServerTime=s.serverTime;
 }
 state=s;snapshotAt=arrivalPerf;
 if(oldRoom!=null&&oldRoom!==s.current){localPred=null;lastRoomKey=null;localRollUntil=0;playerHistory.clear();enemyHistory.clear()}
 const st=Number.isFinite(s.serverTime)?s.serverTime:serverNow();
 for(const p of s.players)if(p.id!==myId)pushHistory(playerHistory,p,st);
 for(const e of s.enemies)pushHistory(enemyHistory,e,st);
 cleanupHistories();
 if(!myId)return;
 const wait=document.getElementById('waitText');if(wait)wait.textContent=s.players.length>=2?'Второй игрок подключился!':'Ждём второго игрока…';
});
</script></body></html>
